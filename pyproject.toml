[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hisaab"
version = "0.0.1"
description = "Personal finance tracker"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36,<2.1",   # tech-design §2 pins 2.0; 2.1 exists, do not drift
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "argon2-cffi>=25.1",
  "google-re2>=1.1",           # template patterns: linear-time matching (tech-design §4.5)
  "pdfplumber>=0.11",          # statement PDFs: words, rules, passwords (tech-design §4.7)
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx2>=2.13"]  # starlette 1.7+ TestClient wants httpx2

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hisaab = ["parsing/seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
