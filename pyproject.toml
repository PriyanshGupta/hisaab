[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hisaab"
version = "0.0.1"
description = "Personal finance tracker"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36,<2.1",   # tech-design §2 pins 2.0; 2.1 exists, do not drift
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "argon2-cffi>=25.1",
  "google-re2>=1.1",           # template patterns: linear-time matching (tech-design §4.5)
  "pdfplumber>=0.11",          # statement PDFs: words, rules, passwords (tech-design §4.7)
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx2>=2.13", "mypy>=2.4"]  # starlette 1.7+ TestClient wants httpx2

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hisaab = ["parsing/seed/*.json", "payees/seed_patterns.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["typings", "src"]   # our stub for google-re2 (no type information); src so tests see hisaab
files = ["src", "tests", "migrations", "spikes/slice0_oauth/authorize.py"]
plugins = ["pydantic.mypy"]    # pydantic models: field coercion and pydantic-settings init arguments

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]  # the Slice 0 spike's own venv has it; the app's does not
ignore_missing_imports = true
